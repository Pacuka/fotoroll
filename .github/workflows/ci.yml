# Checks every pull request (and pushes to main): analyzer, unit tests, the
# integration tests (real app on a virtual display) and the DCO sign-off.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libsecret-1-dev xvfb libgl1-mesa-dri

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable

      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Integration tests (real app, virtual display)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" tool/run_integration_tests.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff ${{ github.base_ref }}'), see CONTRIBUTING.md."
            exit 1
          fi
